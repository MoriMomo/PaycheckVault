<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaycheckVault — Autonomous Cross-Chain Inflow Rebalancer on Reactive Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: {
              950: '#0A0A0C',
              900: '#121215',
              800: '#18181D',
            },
          },
          fontFamily: {
            display: ['Space Grotesk', 'Inter', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #000000;
      background: #000000;
      color: #F5F5F7;
      font-family: 'Inter', sans-serif;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .reactive-card {
      position: relative;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 9999px;
      background: #62D0FF;
      border: 3px solid #000000;
      box-shadow: none;
      cursor: grab;
    }
  </style>
</head>
<body class="min-h-dvh selection:bg-[#2756FC] selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CONFIG = {
      sepolia: {
        chainId: 11155111,
        rpcUrl: 'https://ethereum-sepolia-rpc.publicnode.com',
        explorer: 'https://sepolia.etherscan.io',
        usdcAddress: '0x4f93F4E22F90F1F66C4E56dB10D8a2990035A09e',
      },
      lasna: {
        chainId: 5318007,
        rpcUrl: 'https://lasna-rpc.rnk.dev',
        explorer: 'https://lasna.reactivescan.net',
        reactiveAddress: '0xe18f4DF3B4Faa2D7F49b3F1581c04427a0Be9223',
      },
      baseSepolia: {
        chainId: 84532,
        rpcUrl: 'https://sepolia.base.org',
        explorer: 'https://sepolia.basescan.org',
        vaultAddress: '0x68FE8Ff67a3bF8bC3AdC78b4282bf79E6cbD0142',
        usdcAddress: '0xe18f4DF3B4Faa2D7F49b3F1581c04427a0Be9223',
        wethAddress: '0x4f93F4E22F90F1F66C4E56dB10D8a2990035A09e',
      },
      deployerRvmId: '0x18634B5266369a482836328b8954E67918e5255a',
    };

    const ERC20_ABI = ['function balanceOf(address) view returns (uint256)'];
    const VAULT_ABI = ['function allocationBps() view returns (uint256)'];

    function useAnimatedNumber(targetValue, duration = 400) {
      const [displayValue, setDisplayValue] = useState(targetValue);
      const startValueRef = useRef(targetValue);
      const startTimeRef = useRef(null);

      useEffect(() => {
        startValueRef.current = displayValue;
        startTimeRef.current = null;
        let rafId;
        const step = (timestamp) => {
          if (!startTimeRef.current) startTimeRef.current = timestamp;
          const elapsed = timestamp - startTimeRef.current;
          const progress = Math.min(elapsed / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          setDisplayValue(startValueRef.current + (targetValue - startValueRef.current) * eased);
          if (progress < 1) rafId = requestAnimationFrame(step);
        };
        rafId = requestAnimationFrame(step);
        return () => cancelAnimationFrame(rafId);
      }, [targetValue, duration]);

      return displayValue;
    }

    function App() {
      const [activePage, setActivePage] = useState('landing');
      const [allocationPct, setAllocationPct] = useState(50);
      const [savedPct, setSavedPct] = useState(50);
      const [usdcBalance, setUsdcBalance] = useState(5000.0);
      const [wethBalance, setWethBalance] = useState(0.0);
      const [isLoading, setIsLoading] = useState(false);
      const [lastUpdated, setLastUpdated] = useState(Date.now());
      const [secondsAgo, setSecondsAgo] = useState(0);
      const [loopPhase, setLoopPhase] = useState('idle');
      const [toast, setToast] = useState(null);
      const [walletAddress, setWalletAddress] = useState(null);
      const [showInspector, setShowInspector] = useState(false);

      const animatedUSDC = useAnimatedNumber(usdcBalance);
      const animatedWETH = useAnimatedNumber(wethBalance);

      const [activities, setActivities] = useState([
        {
          id: 1,
          time: 'Ready',
          inflow: '+500.00 USDC',
          lasnaSignal: 'Lasna Active (≥ $10)',
          destSwap: 'Swapped 250 USDC → 125.00 WETH (+250 USDC liquid)',
          status: 'success'
        }
      ]);

      const showToastMsg = (title, subtitle, type = 'success') => {
        setToast({ title, subtitle, type });
        setTimeout(() => setToast(null), 4000);
      };

      const fetchBalances = async () => {
        setIsLoading(true);
        try {
          const provider = new ethers.JsonRpcProvider(CONFIG.baseSepolia.rpcUrl);
          const usdc = new ethers.Contract(CONFIG.baseSepolia.usdcAddress, ERC20_ABI, provider);
          const weth = new ethers.Contract(CONFIG.baseSepolia.wethAddress, ERC20_ABI, provider);
          const vault = new ethers.Contract(CONFIG.baseSepolia.vaultAddress, VAULT_ABI, provider);
          const [uBal, wBal, bps] = await Promise.all([
            usdc.balanceOf(CONFIG.baseSepolia.vaultAddress),
            weth.balanceOf(CONFIG.baseSepolia.vaultAddress),
            vault.allocationBps().catch(() => 5000n)
          ]);
          setUsdcBalance(Number(ethers.formatEther(uBal)));
          setWethBalance(Number(ethers.formatEther(wBal)));
          setSavedPct(Number(bps) / 100);
          setLastUpdated(Date.now());
          setSecondsAgo(0);
        } catch (e) {
          console.warn(e);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchBalances();
        const poll = setInterval(fetchBalances, 15000);
        return () => clearInterval(poll);
      }, []);

      useEffect(() => {
        const tick = setInterval(() => {
          setSecondsAgo(Math.floor((Date.now() - lastUpdated) / 1000));
        }, 1000);
        return () => clearInterval(tick);
      }, [lastUpdated]);

      const connectWallet = async () => {
        if (walletAddress) { setWalletAddress(null); return; }
        if (window.ethereum) {
          try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await provider.send('eth_requestAccounts', []);
            if (accounts[0]) {
              setWalletAddress(accounts[0]);
              showToastMsg('Wallet Connected', `Authenticated RVM ID: ${accounts[0].slice(0, 6)}...${accounts[0].slice(-4)}`);
              return;
            }
          } catch (err) {}
        }
        setWalletAddress(CONFIG.deployerRvmId);
        showToastMsg('Observer Mode Active', 'RVM ID matched across Sepolia, Lasna & Base');
      };

      const simulatePaycheck = async (amount = 500) => {
        if (loopPhase !== 'idle') return;
        setLoopPhase('sepolia');
        await new Promise((r) => setTimeout(r, 750));
        setLoopPhase('lasna');
        await new Promise((r) => setTimeout(r, 850));
        setLoopPhase('base');
        const swappedUSDC = amount * (savedPct / 100);
        const keptUSDC = amount - swappedUSDC;
        const acquiredWETH = swappedUSDC * 0.5;
        setUsdcBalance((prev) => prev + keptUSDC);
        setWethBalance((prev) => prev + acquiredWETH);
        setLastUpdated(Date.now());
        setSecondsAgo(0);
        setActivities((prev) => [
          {
            id: Date.now(),
            time: 'Just now',
            inflow: `+${amount.toFixed(2)} USDC`,
            lasnaSignal: 'Verified (≥ $10)',
            destSwap: `Swapped ${swappedUSDC.toFixed(0)} USDC → ${acquiredWETH.toFixed(2)} WETH (+${keptUSDC.toFixed(0)} USDC liquid)`,
            status: 'success'
          },
          ...prev.slice(0, 4)
        ]);
        showToastMsg('Callback Executed on Base', `Swapped ${swappedUSDC} USDC → ${acquiredWETH.toFixed(2)} WETH (+${keptUSDC} USDC liquid)`);
        await new Promise((r) => setTimeout(r, 1200));
        setLoopPhase('idle');
      };

      const previewSwap = Math.round(1000 * (allocationPct / 100));
      const previewKeep = 1000 - previewSwap;
      const previewWeth = (previewSwap * 0.5).toFixed(2);

      return (
        <div className="min-h-dvh flex flex-col justify-between">
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 max-w-sm p-4 rounded-2xl border border-[#62D0FF]/40 bg-[#121215]/95 backdrop-blur-xl shadow-2xl flex items-start gap-3">
              <span className="mt-1 w-2 h-2 rounded-full bg-[#00C853] animate-ping shrink-0"></span>
              <div className="text-xs space-y-0.5">
                <div className="font-display font-bold text-sm text-white">{toast.title}</div>
                <div className="text-slate-300">{toast.subtitle}</div>
              </div>
            </div>
          )}

          <header className="border-b border-white/8 bg-[#0A0A0C]/85 backdrop-blur-xl sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
              <button onClick={() => setActivePage('landing')} className="flex items-center gap-3 cursor-pointer">
                <div className="w-9 h-9 rounded-xl bg-linear-to-tr from-[#2756FC] to-[#62D0FF] p-px">
                  <div className="w-full h-full bg-[#0A0A0C] rounded-[11px] flex items-center justify-center">
                    <span className="text-[#62D0FF] font-bold">⚡</span>
                  </div>
                </div>
                <span className="font-display text-base font-bold text-white">PaycheckVault</span>
              </button>

              <nav className="flex items-center p-1 rounded-full bg-[#121215] border border-white/8">
                <button
                  onClick={() => setActivePage('landing')}
                  className={`px-4 py-1.5 rounded-full text-xs font-medium transition cursor-pointer ${activePage === 'landing' ? 'bg-[#2756FC] text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  Overview
                </button>
                <button
                  onClick={() => setActivePage('app')}
                  className={`px-4 py-1.5 rounded-full text-xs font-medium transition cursor-pointer ${activePage === 'app' ? 'bg-[#2756FC] text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  Vault App
                </button>
              </nav>

              <div className="flex items-center gap-3">
                <button onClick={() => setShowInspector(!showInspector)} className="text-xs text-slate-400 hover:text-white cursor-pointer">
                  {showInspector ? 'Hide Contracts' : 'Contracts'}
                </button>
                <button onClick={connectWallet} className="px-4 py-2 rounded-full font-semibold text-xs bg-white text-[#0A0A0C] cursor-pointer">
                  {walletAddress ? `${walletAddress.slice(0, 6)}...${walletAddress.slice(-4)}` : 'Connect Wallet'}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-6xl w-full mx-auto px-6 py-8 flex-1">
            {activePage === 'landing' ? (
              <div className="space-y-16 text-center pt-10">
                <div className="space-y-4 max-w-3xl mx-auto">
                  <span className="inline-block text-[11px] font-mono uppercase tracking-widest px-4 py-1.5 rounded-full bg-[#121215] border border-white/10 text-[#62D0FF]">
                    Built on Reactive Network • Set It &amp; Forget It
                  </span>
                  <h1 className="font-display text-4xl sm:text-6xl font-bold text-white tracking-tight">
                    Get Paid on Ethereum.<br />
                    <span className="bg-linear-to-r from-white via-[#62D0FF] to-[#2756FC] bg-clip-text text-transparent">Auto-Invest on Base.</span>
                  </h1>
                  <p className="text-slate-400 text-base sm:text-lg max-w-2xl mx-auto">
                    Recipient-side autonomous smart vault powered by Reactive Network. Inbound Sepolia USDC transfers automatically trigger WETH accumulation on Base in ~1s.
                  </p>
                  <div className="flex justify-center gap-4 pt-2">
                    <button onClick={() => setActivePage('app')} className="px-7 py-3.5 rounded-full font-display font-bold text-sm bg-[#2756FC] text-white cursor-pointer">
                      Launch Vault App &rarr;
                    </button>
                    <button onClick={() => simulatePaycheck(500)} className="px-6 py-3.5 rounded-full font-display font-semibold text-sm bg-[#121215] text-white border border-white/15 cursor-pointer">
                      Simulate Event Loop
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              <div className="space-y-8">
                <div className="flex items-center justify-between">
                  <h1 className="font-display text-2xl font-bold text-white">PaycheckVault <span className="text-[#62D0FF]">Control Center</span></h1>
                  <button onClick={() => simulatePaycheck(500)} className="px-5 py-2.5 rounded-full font-display font-bold text-xs bg-[#2756FC] text-white cursor-pointer">
                    Simulate $500 Paycheck
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="reactive-card p-6 rounded-3xl">
                    <div className="text-xs text-slate-400">Liquid Cash Reserve (Base USDC)</div>
                    <div className="font-mono text-3xl font-bold text-white mt-1">${animatedUSDC.toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
                  </div>
                  <div className="reactive-card p-6 rounded-3xl">
                    <div className="text-xs text-[#62D0FF]">Accumulated WETH (Base Vault)</div>
                    <div className="font-mono text-3xl font-bold text-[#62D0FF] mt-1">{animatedWETH.toFixed(4)} WETH</div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
